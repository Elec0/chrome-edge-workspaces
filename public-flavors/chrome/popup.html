<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Edge Workspaces</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
  <script src="popup.js" type="module"></script>
</head>

<body>
  <div class="app">
    <div class="header-bar">
      <h1 tabindex="-1">Edge Workspaces</h1>
      <div class="header-bar-right">
        <span id="workspace-reorder-toggle" class="material-icons icon-button" title="Reorder workspaces"
          role="button" tabindex="0" aria-label="Reorder workspaces" aria-controls="workspaces-list"
          aria-pressed="false" hidden>swap_vert</span>
        <span id="addWorkspace" class="material-icons icon-button" title="Add workspace"
          role="button" tabindex="0" aria-label="Add workspace" aria-haspopup="dialog">add_circle</span>
        <span id="settings-button" class="material-icons icon-button" title="Settings"
          role="button" tabindex="0" aria-label="Settings" aria-haspopup="dialog">menu</span>
      </div>
    </div>
    <div id="workspace-rename-warning" role="alert"></div>
    <div id="workspace-reorder-status" role="status"></div>
    <div id="workspaces-list" class="workspaces">
      <!-- Whatever is here will be removed once the workspaces list loads -->
       If you see this message, it means that the workspaces list is still loading.<br>
       If this message persists, please file a bug report <a href="https://github.com/Elec0/chrome-edge-workspaces/issues/new?template=bug_report.md">here</a>.
    </div>

  </div>
</body>

</html>
